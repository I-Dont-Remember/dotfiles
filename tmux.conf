# tmux.conf — reasonable defaults for Kevin's dotfiles
# Prefix: Ctrl+a (ergonomic, classic screen-style)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support
set -g mouse on

# Start windows and panes at 1, not 0 (easier keyboard reach)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Splits with visual mnemonics
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in current path
bind c new-window -c "#{pane_current_path}"

# Vi copy mode
setw -g mode-keys vi

# 256-color terminal
set -g default-terminal "screen-256color"

# Status bar — simple: hostname, session, date/time
set -g status-right "#H | #S | %Y-%m-%d %H:%M"
set -g status-right-length 60

# Reduce escape-time for vim/neovim
set -sg escape-time 10

# Increase scrollback buffer
set -g history-limit 10000
